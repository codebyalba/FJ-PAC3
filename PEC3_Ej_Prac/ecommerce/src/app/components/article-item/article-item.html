<div class="article-card" [class.on-sale]="article.isOnSale">
  <img [src]="article.imageUrl" [alt]="article.name" class="article-image">

  <h2>{{ article.name }}</h2>
  <p class="price">{{ article.price | currency:'EUR' }}</p>
  <p *ngIf="article.isOnSale" class="sale-label">En venda!</p>

  <div class="quantity-controls">
    <button (click)="decrement()" [disabled]="article.quantityInCart === 0">-</button>
    <span>{{ article.quantityInCart }}</span>
    <button (click)="increment()">+</button>
  </div>
</div>
